name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (created at the selected ref if it doesn't exist)"
        required: true
        type: string
      notes:
        description: "Release notes (markdown); leave empty to auto-generate"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$NOTES" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
            fi
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
          fi
